<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assembly Share</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #0b0f0c;
      color: #e8f0ea;
      font-family: system-ui, sans-serif;
      overflow: auto;
    }
    .shell {
      box-sizing: border-box;
      width: 100%;
      max-width: 980px;
      min-height: 100%;
      margin: 0 auto;
      padding: 1.25rem;
    }
    .brand {
      margin: 0;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      color: #3ddc84;
      font-weight: 700;
    }
    h1 { margin: 0.2rem 0 0; font-size: 1.45rem; }
    .overlay { padding: 2rem 0; color: #8fa396; }
    .stage {
      min-height: 240px;
      background: #121a14;
      border: 1px solid #243028;
      border-radius: 12px;
    }
  </style>
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <p class="brand">ASSEMBLY SHARE</p>
        <h1 id="title">Carregando interface…</h1>
      </div>
      <div class="meta" id="meta">—</div>
    </header>

    <section class="stage">
      <video id="preview" autoplay playsinline muted></video>
      <video id="remote" autoplay playsinline muted hidden></video>
      <canvas id="view" hidden></canvas>
      <div class="overlay" id="overlay">
        <p id="status">Iniciando…</p>
      </div>
    </section>

    <section class="controls">
      <button id="mainBtn" class="primary" disabled>Aguarde</button>
      <details class="advanced">
        <summary>Qualidade</summary>
        <label>
          Preset
          <select id="quality">
            <option value="ultra" selected>Ultra · 1080p60 · 12 Mbps</option>
            <option value="high">Alta · 1080p30 · 8 Mbps</option>
            <option value="balanced">Equilibrada · 720p30 · 4 Mbps</option>
          </select>
        </label>
        <p class="hint">Padrão já é superior à maioria das Activities. Só mude se a rede pedir.</p>
      </details>
    </section>
  </main>

  <script type="module" src="static/bootstrap.js"></script>
  <noscript>Ative JavaScript para usar o Assembly Share.</noscript>
</body>
</html>
